<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Aéreo San Martín 2026</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="map" aria-label="Recorrido aéreo 3D por el Partido de General San Martín"></main>
  <section class="hud">
    <div class="eyebrow">AÉREO 2026 · GENERAL SAN MARTÍN</div>
    <h1 id="stopName">UNSAM · CAMPUS MIGUELETE</h1>
    <p id="stopMeta">POSTA 01 · DESPEGUE</p>
  </section>
  <div class="controls">
    <button id="startBtn" class="primary">DESPEGAR</button>
    <button id="pauseBtn" disabled>PAUSA</button>
    <button id="restartBtn">REINICIAR</button>
  </div>
  <nav id="routeNav" class="route-nav" aria-label="Postas del recorrido"></nav>
  <div class="altimeter"><span>ALT</span><strong id="altitude">0 m</strong></div>
  <div id="status" class="status">Preparando aeronave…</div>
  <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
