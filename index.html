<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Recorrido aéreo 3D por nueve postas del Partido de General San Martín.">
  <title>Aéreo San Martín 2026</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%88%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="map" aria-label="Recorrido aéreo 3D por el Partido de General San Martín"></main>
  <section class="hud">
    <div class="eyebrow">AÉREO 2026 · GENERAL SAN MARTÍN</div>
    <h1 id="stopName">UNSAM · CAMPUS MIGUELETE</h1>
    <p id="stopMeta">POSTA 01 · ELEVACIÓN</p>
  </section>
  <div class="controls">
    <button id="mapModeBtn" type="button" aria-pressed="true" aria-label="Usar mapa vectorial" disabled>SATÉLITE</button>
    <button id="startBtn" type="button" class="primary">ELEVAR</button>
    <button id="pauseBtn" type="button" aria-pressed="false" disabled>PAUSA</button>
    <button id="restartBtn" type="button">REINICIAR</button>
  </div>
  <nav id="routeNav" class="route-nav" aria-label="Postas del recorrido"></nav>
  <div class="altimeter"><span>ALT</span><strong id="altitude">0 m</strong></div>
  <div id="status" class="status" role="status" aria-live="polite">Preparando aeronave…</div>
  <a id="satelliteCredit" class="satellite-credit" href="https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer" target="_blank" rel="noopener">IMÁGENES © ESRI Y PROVEEDORES</a>
  <a class="airship-credit" href="https://github.com/C2DH/zoomland" target="_blank" rel="license noopener">AIRSHIP · C2DH/ZOOMLAND · AGPL-3.0</a>
  <noscript>Esta experiencia necesita JavaScript para mostrar el mapa y el recorrido 3D.</noscript>
  <script src="boot.js"></script>
  <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
